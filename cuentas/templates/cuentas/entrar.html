{% extends "cuentas/base.html" %}

{% block clase %}acceso{% endblock %}

{% block contenido %}
<form class="formulario" action="{% url 'cuentas:entrar' %}" method="post">
{% csrf_token %}
{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
<fieldset>
    <legend><h1>Entrar</h1></legend>
    {% if error_message %}<p class="error"><strong>{{ error_message }}</strong></p>{% endif %}
    <p class="campo">
        <label for="username">Usuario</label>
        <input type="text" name="username" id="username" value="{{ username }}">
    </p>
    <p class="campo">
        <label for="password">Contraseña</label>
        <input type="password" name="password" id="password">
    </p>
</fieldset>
<input type="submit" value="Entrar">
<p class="pie"><a href="{% url 'cuentas:registro' %}">Registrarse</a></p>
</form>
{% endblock %}
