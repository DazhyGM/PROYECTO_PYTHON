{% extends "cuentas/base.html" %}

{% block contenido %}
<form class="formulario" action="{% url 'cuentas:editar' cuenta.id %}" method="post">
{% csrf_token %}
<fieldset>
    <legend><h1>Editar {{ cuenta.servicio }} — {{ cuenta.mes }}</h1></legend>
    {% if error_message %}<p class="error"><strong>{{ error_message }}</strong></p>{% endif %}
    <div class="opciones">
    {% for servicio in servicio_list %}
        <div class="opcion">
            <input type="radio" name="servicio" id="servicio{{ forloop.counter }}" value="{{ servicio.id }}" {% if servicio.id == servicio_id %}checked{% endif %}>
            <label for="servicio{{ forloop.counter }}">{{ servicio.nombre }}</label>
        </div>
    {% endfor %}
    </div>
    <p class="campo">
        <label for="mes">Mes</label>
        <input type="text" name="mes" id="mes" value="{{ mes }}">
    </p>
    <p class="campo">
        <label for="valor">Valor</label>
        <input type="text" name="valor" id="valor" value="{{ valor }}">
    </p>
    <p class="campo">
        <label for="vence">Vence (AAAA-MM-DD)</label>
        <input type="text" name="vence" id="vence" value="{{ vence }}">
    </p>
</fieldset>
<input type="submit" value="Guardar">
</form>
{% endblock %}
