{% extends "cuentas/base.html" %}

{% block clase %}acceso{% endblock %}

{% block contenido %}
<form class="formulario" action="{% url 'cuentas:registro' %}" method="post">
{% csrf_token %}
<fieldset>
    <legend><h1>Registrarse</h1></legend>
    {% if error_message %}<p class="error"><strong>{{ error_message }}</strong></p>{% endif %}
    <p class="campo">
        <label for="username">Usuario</label>
        <input type="text" name="username" id="username" value="{{ username }}">
    </p>
    <p class="campo">
        <label for="password">Contraseña</label>
        <input type="password" name="password" id="password">
    </p>
    <p class="campo">
        <label for="password2">Repite la contraseña</label>
        <input type="password" name="password2" id="password2">
    </p>
</fieldset>
<input type="submit" value="Crear cuenta">
<p class="pie"><a href="{% url 'cuentas:entrar' %}">Entrar</a></p>
</form>
{% endblock %}
