{% extends "cuentas/base.html" %}

{% block contenido %}
<h1>Servicios</h1>
{% if servicio_list %}
    <ul class="servicios">
    {% for servicio in servicio_list %}
        <li><a href="{% url 'cuentas:detail' servicio.id %}">{{ servicio.nombre }}</a></li>
    {% endfor %}
    </ul>
{% else %}
    <p class="vacio">No hay servicios.</p>
{% endif %}
{% endblock %}
